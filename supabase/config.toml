project_id = "nacos-south-east"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db.migrations]
enabled = true
schema_paths = []

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5174/**", "http://localhost:5175/**", "http://127.0.0.1:5175/**"]
enable_signup = false

[storage]
enabled = true

[functions.create-subadmin]
verify_jwt = true

[functions.list-subadmins]
verify_jwt = true

[functions.manage-subadmin]
verify_jwt = true
